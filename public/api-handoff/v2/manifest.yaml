consumer_rules:
- Read README.md, the concrete OpenAPI operations and examples/PianoLITV2Client.swift
  for the connection procedure.
- Pin one revision per integration task; published revisions remain immutable.
- Draft describes pending native/staging acceptance. An implemented, production_verified
  backend with a populated production_base_url may be used to integrate these documented
  operations; draft alone is not evidence of a live service.
- Use only the runtime base URL marked verified; deployment_target alone is not verification.
- Keep the current email/password screen and accounts. Point its request to v2 login,
  save the returned credential in Keychain, then request v2 Discover with Authorization
  bearer.
- Legacy users lacking a v2 credential sign in once after upgrade; never silently
  exchange stored user_id for access.
- Preserve installed legacy clients and their endpoints indefinitely. This work does
  not require updating the old app.
- Discover cards are summaries, not complete PieceVC detail models or media entitlements.
  Use the documented target/fallback boundary.
- Record consumed revision, native commit/build, device checks and unresolved destinations
  in the iOS repository.
changelog:
- revision: 2026-10-29.1
  changes:
  - Added Latin American composers as a third equally eligible nonempty composer-feature
    pool in the shared web/v2 cache, retaining one stable selection per cache refresh.
  - Added latin_american_composers with the existing composer_feature kind; legacy
    mobile rows and cache remain unchanged.
  - Implemented locally only; production deployment and staging/native acceptance
    remain pending. Preserved prior immutable revisions.
- revision: 2026-10-28.1
  changes:
  - Implemented independent v2 email/password credential issuance, bearer authentication,
    revocation and account-owned history.
  - Moved web Discover content selection and level grouping into shared services consumed
    by web and v2; legacy feed stays unchanged.
  - Added concrete OpenAPI operations, synthetic fixtures and a Swift URLSession/Keychain
    connection example.
  - Production deployment and native verification are recorded separately; previous
    published revisions remain immutable.
- revision: 2026-10-22.2
  changes:
  - Recorded the developer's static UIKit/iOS 17.6/email-password baseline with its
    verification limits.
  - Arthur confirmed sign-in remains required for the initial native v2 release.
  - Identified positional Free Pick handling and legacy detail/search dependencies
    in Discover.
  - No runtime implementation or deployment; retained the previous immutable handoff
    revision.
- revision: 2026-10-22.1
  changes:
  - Established the handoff format, shared API proposals and compatibility boundaries.
  - Inventoried Discover against the current web implementation.
  - No runtime endpoints, migrations, Swift changes or deployment in this revision.
