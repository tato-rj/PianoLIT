id: foundations
status: draft
scope: Implemented isolated login and Discover foundation; native/staging acceptance pending.
evidence_date: '2026-10-28'
backend_status: production_verified
source_evidence:
  - app/Providers/RouteServiceProvider.php
  - routes/api-v2.php
  - app/Http/Middleware/Api/V2/Boundary.php
  - app/Http/Middleware/Api/V2/Authenticate.php
  - app/Services/Api/V2/Tokens.php
  - app/Services/Discover/Feed.php
  - tests/Review/ApiV2DiscoverTest.php
fixed_constraints:
  - Legacy /api routes, media delivery, login, JSON, memberships and analytics remain supported indefinitely; no old-app update is required.
  - New app uses v2 email/password credential issuance; stored user_id cannot authenticate.
  - Keep UIKit/storyboards and the existing iOS deployment target; native source is outside this repository.
  - Never apply the browser Access Limits matrix to native media or change shared model serialization to shape v2.
  - No email, billing, social sign-in, guest browsing or identity-server migration.
implemented:
  routing:
    prefix: /api/v2
    route_names: api.v2.*
    route_file: routes/api-v2.php
    boundary: Explicit registration before the legacy API, outside its middleware group; no AttemptLoginAppUser, browser session, location or legacy analytics middleware.
    errors: V2-only JSON error/meta envelopes, including without Accept headers; request IDs generated by the server.
    limits: 120 requests/minute/IP overall; login also 5 attempts/minute/IP with independent limiter prefix. Obey Retry-After on 429.
  identity:
    login: POST /api/v2/auth/login accepts the same account email/password through the existing users provider.
    transport: Authorization bearer over HTTPS to the fixed API origin only; query tokens, cookies and user_id are not accepted as proof.
    token: 256 random bits per session; only SHA-256 hash is stored in api_v2_tokens.
    expiry: 30 days. No refresh token. Sign in again after expiry or invalidation.
    password_changes: HMAC password fingerprint invalidates existing credentials after password change/reset, without modifying the users JSON/model.
    logout: POST /api/v2/auth/logout deletes only the current token; other installations and browser/legacy sign-in are unchanged.
    deletion: Token rows cascade with User deletion; a later signup gets a new identity.
    client_storage: Keychain only. No password persistence; no secrets in logs, YAML or UserDefaults.
    upgrade: One existing-password sign-in when an upgraded installation has no v2 credential; no secure silent exchange exists for legacy local IDs alone.
    registration: Retain the existing signup/recovery interfaces; authenticate the just-entered password through v2 afterward. Legacy signup JSON does not establish v2 identity.
    account_fields: Submitted user_id is ignored, never used as an override; history always belongs to the verified token principal.
  data:
    source: App\Services\Discover\Feed is used by web and v2; legacy selection remains unchanged.
    levels: App\Services\Discover\Levels supplies both web and v2 grouping/order.
    shape: Explicit allowlisted DTOs, decimal string entity IDs, JSON booleans, UTC Z timestamps and absolute URLs. No raw model serialization.
    envelope: data/meta on JSON success; error/meta on error; 204 without body for logout/history writes.
    empty: Omit empty sections; collections remain arrays. Unknown kinds must not crash a client.
    history: Existing RecentlyViewedPieces service; actual confirmed opens only, account-owned and excluded-account aware. No feed/prefetch writes.
  caches:
    catalogue: Both modern consumers read the same existing web catalogue cache/refresh clock, separate from the legacy mobile cache. No independent v2 content curation or duplicate public selection.
    personal: Only recommendation IDs cached by account ID + favorites/tag-state hash + admin refresh + Free Pick identity; daily TTL, current-record rehydration. Recent history is read fresh.
    artwork: Pin fallback artwork daily by source metadata and canonical app origin, shared between modern consumers; originals/mobile media URLs unchanged.
    response: Cache-Control private, no-store. Never cache authenticated whole responses publicly.
    isolation: Clone public-cache models before adding presentation attributes. No shared model appends/hidden-field changes.
  navigation:
    targets: Explicit kind/entity/query plus public web_url fallback; never attach bearer credentials to fallback or media URLs.
    incomplete_flows: Piece detail/search/playback/favorites/membership are still separate migrations. A Discover summary cannot initialize the full legacy PieceVC model.
verification:
  local: Isolated SQLite tests cover login compatibility, rejection of spoofed identity, lifetime/revocation, errors/throttling, shared content IDs/artwork, account isolation, Free Pick rotation and immutable legacy cache objects.
  deployment: See manifest runtime verification; local checks alone do not prove production deployment.
  native: Pending developer integration and actual iPhone/iPad checks; Swift sample type checking is not device verification.
remaining:
  - Record staging URL and synthetic test-account procedure; verify full native login/refresh/logout/account-switch flow.
  - Implement/test the explicit native destination adapters or use the documented public browser fallback.
  - Specify native media entitlements and the next v2 detail/search contracts separately; preserve existing App Store billing and super-user behavior.
  - Verify simulator/device UI, accessibility, retry/offline and native build identifiers before readiness/release promotion.
