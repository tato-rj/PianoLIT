id: discover
status: draft
depends_on: [foundations]
backend_status: not_started
ios_status: not_started
objective: Match the current web Discover hierarchy using native iOS components and explicit v2 data.
proposed_operation:
  method: GET
  path: /api/v2/discover
  operation_id: getDiscover
  implemented: false
  schema_status: pending_D1
  authentication: Proposed guest read with optional verified bearer credential; invalid supplied credentials return 401.
  response: One bounded ordered sections array inside data; stable section IDs and typed content, never title-based dispatch.
  persistence: Fetching Discover does not record a piece view or mutate favorites.

web_evidence:
  - app/Api/Api.php
  - app/Api/Factory.php
  - app/Http/Controllers/WebApp/TabsController.php
  - app/Services/RecentlyViewedPieces.php
  - resources/views/webapp/discover/index.blade.php
  - resources/views/webapp/discover/rows/gallery.blade.php
  - resources/views/webapp/discover/rows/levels.blade.php
  - resources/views/webapp/discover/rows/past-highlights.blade.php
  - resources/views/webapp/discover/rows/for-you.blade.php
  - tests/Review/DiscoverLevelsTest.php
  - tests/Review/DiscoverPieceRowsTest.php
  - tests/Review/RecentlyViewedPiecesTest.php

proposed_sections_in_display_order:
  - id: free_pick
    title: Free weekly pick
    presentation: featured_piece
    data: Current scheduled Free Pick, artwork, piece identity, composer and display metadata.
    empty: Omit when there is no current pick.
    behavior: Open native piece detail; the badge does not by itself authorize full media.
  - id: composers
    title: Composers
    presentation: portrait_rail
    data: Composer IDs, names, portrait URLs and piece counts.
    action: View all opens the native composers directory; a portrait opens that composer's destination.
  - id: recently_viewed
    title: Recently viewed
    presentation: compact_piece_rail
    maximum_items: 12
    audience: Verified signed-in account with permitted personalization and nonempty history.
    ordering: Distinct pieces ordered by most recent account-owned view, with piece ID tie-breaker.
    empty: Omit for guests, excluded accounts, unavailable personalization and empty history.
    dependency: D2 must include a verified native piece-open history write, not only a history read.
  - id: latest_pieces
    title: Latest pieces
    presentation: artwork_piece_rail
    data: Piece IDs, title, composer/attribution, artwork, difficulty, media flags and is_new.
    action: View all opens the complete native catalogue with the documented filter/sort.
    new_badge: Server-derived from the existing five-day window; do not infer on the device.
  - id: for_you
    title: For you
    subtitle: Picked for your level and taste.
    presentation: compact_piece_rail_in_lavender_panel
    maximum_items: 10
    audience: Verified account with permitted personalization and nonempty recommendations.
    empty: Omit; do not label random guest pieces as personalized.
  - id: women_composers
    title: From women composers
    presentation: composer_feature_with_piece_list
    data: Featured composer portrait, plain-text biography excerpt, native destinations and bounded piece list.
    style: Cream panel with white piece cards; adapt the desktop split layout to phone width.
  - id: levels
    title: Find pieces at your level
    subtitle: Similar difficulty to RCM, ABRSM or Suzuki books.
    presentation: segmented_level_rail
    systems: [rcm, abrsm, suzuki]
    labels: [RCM, ABRSM, Suzuki]
    default: First nonempty system in the above order.
    ordering: Numeric within each system; never lexicographic 1, 10, 2.
    data: Explicit system, level/book number, display label, count and typed search target.
    empty: Disable empty systems; omit the section when all systems are empty.
    behavior: Switching systems changes this section in place and preserves the page position.
    note: The current web page merges three legacy ranking rows into one selector.
  - id: past_highlights
    title: Past highlights
    presentation: featured_piece_with_compact_list
    maximum_items: 7
    observed_web_selection: Previous highlighted pieces, excluding current Free Pick and future highlight dates, ID descending.
    behavior: First item is featured; remaining cards stay white. View all opens native highlights.
    note: This replaces the old Black-composer band on web Discover only; do not change legacy mobile rows.
  - id: mood
    title: Server-provided plain-text mood heading
    presentation: compact_piece_rail
    data: Selected mood identifier/label and bounded piece list.
  - id: similar_to_free_pick
    title: Like this week's free pick
    presentation: compact_piece_rail
    data: Current Free Pick identity and bounded related pieces.
    empty: Omit when there is no current pick or no results.
    decision: Confirm v2 recommendation ranking explicitly; web and legacy mobile currently differ.

data_contract_to_finalize_in_D1:
  - Define PieceSummary, ComposerSummary, LevelGroup and discriminated section schemas in openapi.yaml.
  - Fix per-section limits, ordering and catalogue eligibility; do not inherit random legacy limits accidentally.
  - Use stable semantic section IDs; the same piece may appear in multiple sections.
  - Specify required fields versus nullable fields and approved artwork fallbacks.
  - Represent destinations by kind and entity/filter IDs, not PHP class names or legacy source URLs.
  - Specify the native destinations before enabling View all and composer/level taps.
  - Add guest, populated-account, empty-account, missing-artwork, no-Free-Pick and error JSON fixtures.
  - Document unsupported section-kind handling and unavailable navigation targets.
  - Keep account data out of shared cached objects and clear local personal data after logout.
  - Resolve native personalization/access decisions before copying any web restriction.

interaction_and_state_requirements:
  loading: Show a native loading state without membership prompts or playback.
  refresh: Pull to refresh preserves visible data until a replacement response succeeds; prevent duplicate requests.
  failure_without_data: Show a clear error and Retry action.
  failure_with_data: Keep the last successful same-account response and show a retry indication.
  empty_feed: Show a deliberate empty state; no empty headings or placeholder collections pretending to contain data.
  stale_requests: Cancel or discard old responses after logout, account switch, navigation or a newer refresh.
  navigation: Tapping a piece opens its native detail; horizontal swipes must not trigger taps.
  unsupported_section: Skip unknown presentation kinds without crashing; do not infer new navigation or access rights.
  offline: Never show a previous account's cached personal rows; define cache persistence with the iOS developer.
  media: No autoplay; media icons report availability and do not grant access.
  favorites: Do not introduce quick-save behavior; any added heart needs the separately specified folder-picker flow.
  accessibility: Support VoiceOver, Dynamic Type, Reduce Motion and large text without clipped controls.

acceptance_checks:
  - Guest response has no Recently viewed, For you or account identifiers.
  - Account A cannot receive account B's history or recommendations, including cached and delayed responses.
  - Recently viewed precedes Latest pieces and includes at most 12 distinct pieces.
  - Opening a piece with verified native identity updates history; feed fetch and image prefetch do not.
  - Levels appear once, with RCM/ABRSM/Suzuki tabs and numeric order.
  - Past highlights excludes the current Free Pick and never changes its current access status.
  - All compact/artwork piece cards remain white on the shared grey surface.
  - Every visible tap/action has a tested native destination or a documented compatibility bridge.
  - Account switch, empty results, missing artwork, offline and retry states work.
  - Approved phone/iPad references are compared with actual simulator screenshots and accessible large-text renders.
  - Legacy /api/discover response shape, media URLs, logging and cache contents remain unchanged.

out_of_scope:
  - Native playback, score editing, billing or entitlement redesign.
  - Changing the existing API to look like this screen specification.
  - Rewriting the current web Discover or changing its data selection.
  - Treating this draft as an endpoint implementation or visual approval.
