          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '410':
          description: 'tour_expired: two-hour tour lifetime elapsed. Start with a
            new UUID, retaining the account bearer.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: 'invalid_request or invalid_answer: malformed fields or a choice
            not served for this question.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: 'rate_limited: obey Retry-After; reuse request_id/body after
