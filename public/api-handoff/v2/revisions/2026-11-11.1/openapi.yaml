              schema:
                type: integer
                minimum: 1
        '500':
          description: Server error; no internal details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '204':
          description: History updated, or excluded account intentionally skipped.
  /match-tours:
    post:
      operationId: startMatchTourV2
      summary: Start or reload an account-owned Find my match tour
      description: 'Bearer required. Shared web draw: four distinct level examples,
        four listening pieces and two contrasting taste pairs. Two-hour absolute expiry;
        no sliding extension. Same account/start request_id returns the same tour.
        A new UUID deliberately restarts without invalidating other tours. Limit 10
        starts/minute/IP in addition to the overall 120 requests/minute/IP.'
      x-deployment:
        backend_status: implemented_locally
        production_verified: false
      responses:
        '401':
          description: 'unauthenticated: account credential invalid/missing/expired/revoked.
            Only this error requires signing in again.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 'not_found: unknown, another account’s, or pruned tour. Do
            not sign out.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: stale_tour, idempotency_conflict, incomplete_tour or tour_limit.
            Reload; see the error code and match-tour guide.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '410':
          description: 'tour_expired: two-hour tour lifetime elapsed. Start with a
            new UUID, retaining the account bearer.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: 'invalid_request or invalid_answer: malformed fields or a choice
            not served for this question.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: 'rate_limited: obey Retry-After; reuse request_id/body after
            waiting.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
        '500':
          description: 'server_error: retry safely with the same request_id/body;
            no internal details.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: tour_unavailable, media_unavailable or no_match. Keep the account
            signed in; result remains null unless valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '200':
          description: Complete current tour snapshot. All JSON responses are private/no-store;
            no cookies. New signed sample URLs are issued on each load.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchTourResponse'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TourStartRequest'
            example:
              request_id: 11111111-1111-4111-8111-111111111111
  /match-tours/{tour}:
    get:
      operationId: loadMatchTourV2
      summary: Load choices, answers and progress
      description: 'No advancement or recommendation reroll. Return all fixed choices
        and accepted answers for back navigation. reading-2 is null until reading-1
        is answered, then follows the website: easy → advanced; difficult → beginner,
        with elementary fallback if no beginner sample. GET refreshes signed media
        URLs without extending tour expiry.'
      x-deployment:
        backend_status: implemented_locally
        production_verified: false
      responses:
        '401':
          description: 'unauthenticated: account credential invalid/missing/expired/revoked.
            Only this error requires signing in again.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 'not_found: unknown, another account’s, or pruned tour. Do
