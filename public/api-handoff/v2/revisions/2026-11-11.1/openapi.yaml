openapi: 3.0.3
info:
  title: PianoLIT mobile API v2 — Discover, Collections, piece detail, favorite folders and Find my match
  version: 1.4.0
  description: Independent v2 login and Discover. Web and v2 share App\Services\Discover\Feed.
    Legacy /api routes remain supported indefinitely. Deployment/native verification
    is recorded in the manifest; downloading this specification does not authenticate
    an app. Find my match reuses the web tour draw and ranking. The completed native
    steps 1–4 keep their existing design; replace only their data/calculations. New
    match operations are implemented locally and disabled until media preparation
    and deployment verification. Piece detail uses the shared Pieces\PageContent,
    WebTimeline, PieceRecommendations and native bearer identity. Favorite-folder writes
    reuse website records and limits; they are implemented locally with deployment pending.
    Collections uses the shared web catalog and weekly feature with native bearer access.
servers:
- url: https://pianolit.com/api/v2
  description: Login, Discover, confirmed piece-open history, piece detail and Collections
    are live. Collections was verified on 2026-11-11. Match-tour activation, expanded
    composer-pool acceptance and native/staging verification remain separate.
security:
- MobileBearer: []
x-handoff:
  revision: 2026-11-11.1
  status: draft
  implemented: true
  native_integration: pending
paths:
  /collections:
    get:
      operationId: listCollectionsV2
      summary: List published curated repertoire collections
      description: >-
        Includes the featured card once in collections. Use featured_collection_id
        to select it. Returns all eligible cards ordered by saved collection order
        then numeric ID, without pagination. All signed-in accounts see all cards.
        Only the current featured collection can be opened without a membership.
      responses:
        '200':
          description: Complete catalog, including an explicit null featured ID and empty array when empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionCatalogResponse'
        '401':
          $ref: '#/components/responses/CollectionUnauthenticated'
        '429':
          $ref: '#/components/responses/CollectionRateLimited'
        '500':
          $ref: '#/components/responses/CollectionServerError'
  /collections/{collection}:
    get:
      operationId: getCollectionV2
      summary: Read a curated collection and its ordered pieces
      description: >-
        Returns all visible piece rows in saved collection-piece order, with pivot
        row ID breaking ties, without pagination. The current featured collection
        is available to every signed-in account. A signed-in nonmember requesting a
        regular collection gets its metadata and full count with access
        membership_required and pieces []. Each row is a Discover PieceSummary.
        In Collections, media.performance describes a saved PianoLIT performance video
        with a nonempty URL. Fetch /pieces/{piece} for actual media authorization.
        No analytics or history event is written.
      parameters:
      - name: collection
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
      responses:
        '200':
          description: Available detail with pieces, or locked detail with metadata and an empty pieces array.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionDetailResponse'
        '401':
          $ref: '#/components/responses/CollectionUnauthenticated'
        '404':
          description: Unknown or ineligible collection (not_found) or malformed path ID (request_failed).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          $ref: '#/components/responses/CollectionRateLimited'
        '500':
          $ref: '#/components/responses/CollectionServerError'
  /favorite-folders:
    get:
      operationId: listFavoriteFoldersV2
      summary: List every owned folder and selected-piece state
      description: Bearer only. Includes empty folders ordered by name then ID; no history/analytics writes.
        Same shared records as website. Implemented locally, production deployment pending.
      parameters:
      - in: query
        name: piece_id
        required: true
        schema:
          type: string
          pattern: ^[1-9][0-9]*$
      responses:
        '200':
          description: Authoritative current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteFolderListResponse'
        '401':
          description: 'unauthenticated: Missing/invalid/expired/revoked bearer; sign in again.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 'not_found: Missing piece, missing folder or folder not owned. Malformed route paths
            retain generic request_failed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: 'invalid_request: Invalid JSON/fields, name, ID string, duplicate name or UUID header.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: 'rate_limited: Obey Retry-After before retrying.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Retry-After:
              description: Seconds until retry is permitted.
              schema:
                type: integer
                minimum: 1
        '500':
          description: 'server_error: Retry later; preserve creation key/payload.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    post:
      operationId: createFavoriteFolderV2
      summary: Create a folder and optionally save one piece atomically
      description: Bearer only; rejects unknown body properties. Trim name before validation (3–36 characters,
        unique per account). Same website account limits. Optional account-scoped UUID Idempotency-Key active
        for 24 hours from success; normalized name + optional piece ID determines payload identity. Same
        key/data returns original folder with current state and 201, never reapplying later removals; deleted/non-owned
        folder gives 404. Different data gives 409. Failed requests consume no key. After expiry a new request
        is subject to name uniqueness/quotas. Without key no replay guarantee. Favorite writes share 30
        requests/minute/account plus the outer v2 limiter. Deploy receipt migration before code; locally
        implemented only. See examples/favorite-folders.md.
      parameters:
      - in: header
        name: Idempotency-Key
        required: false
        schema:
          type: string
          format: uuid
        description: Retain the same UUID and payload for retries of one submission; account scoped, 24-hour
          active retention.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FavoriteFolderCreateRequest'
            example:
              name: Pieces to learn
              piece_id: '1032'
      responses:
        '201':
          description: Authoritative current state; creation replays also return 201.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteFolderMutationResponse'
        '401':
          description: 'unauthenticated: Missing/invalid/expired/revoked bearer; sign in again.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '403':
          description: 'favorite_folders_blocked, favorite_folder_limit_reached, favorite_saves_blocked
            or favorite_piece_limit_reached: Same saved limits as website; removal stays allowed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 'not_found: Missing piece, missing folder or folder not owned. Malformed route paths
            retain generic request_failed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: 'invalid_request: Invalid JSON/fields, name, ID string, duplicate name or UUID header.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 'idempotency_conflict: Active key reused with different validated request data.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: 'rate_limited: Obey Retry-After before retrying.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Retry-After:
              description: Seconds until retry is permitted.
              schema:
                type: integer
                minimum: 1
        '500':
          description: 'server_error: Retry later; preserve creation key/payload.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /favorite-folders/{folder}/pieces/{piece}:
    parameters:
    - in: path
      name: folder
      required: true
      schema:
        type: string
        pattern: ^[1-9][0-9]*$
    - in: path
      name: piece
      required: true
      schema:
        type: string
        pattern: ^[1-9][0-9]*$
    put:
      operationId: saveFavoriteV2
      summary: Ensure the piece is in this owned folder
      description: Bearer only. No body or empty JSON object. Idempotent, returns current heart and folder
        counts. Checks folder ownership on every request; never affects another folder. Already-present
        PUT succeeds under lowered quotas; DELETE bypasses addition restrictions. Shared owner lock and
        membership uniqueness prevent duplicate records. 30 writes/minute/account plus outer v2 limit; removals
        are still throttled. Locally implemented; deployment pending.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: Authoritative current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteFolderMutationResponse'
        '401':
          description: 'unauthenticated: Missing/invalid/expired/revoked bearer; sign in again.'
          content:
            application/json:
              schema:
