          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
        '500':
          description: 'server_error: retry safely with the same request_id/body;
            no internal details.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: tour_unavailable, media_unavailable or no_match. Keep the account
            signed in; result remains null unless valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '200':
          description: Complete current tour snapshot. All JSON responses are private/no-store;
            no cookies. New signed sample URLs are issued on each load.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchTourResponse'
      parameters:
      - name: tour
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /match-tours/{tour}/answers/{slot}:
    put:
      operationId: answerMatchTourV2
      summary: Submit or replace one answer
      description: Send a fresh request_id and the latest integer revision for each
        deliberate edit. Slots must be answered in sequence but any earlier answer
        can be edited. A changed answer clears every later answer and the pinned match;
        an identical value preserves later state and revision. Exact request retries
        return the latest snapshot without repeating the mutation, even after further
        edits. Reusing a UUID with a different body/slot returns 409. Row locking
        and revisions prevent concurrent double advancement. Maximum 256 accepted
        distinct request IDs per tour; restart after tour_limit. JSON null explicitly
        skips taste-1/taste-2 only. IDs must belong to that tour and round; user_id,
        local level calculations and client estimates cannot select results.
      x-deployment:
        backend_status: implemented_locally
        production_verified: false
      responses:
        '401':
          description: 'unauthenticated: account credential invalid/missing/expired/revoked.
            Only this error requires signing in again.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 'not_found: unknown, another account’s, or pruned tour. Do
            not sign out.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: stale_tour, idempotency_conflict, incomplete_tour or tour_limit.
            Reload; see the error code and match-tour guide.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '410':
          description: 'tour_expired: two-hour tour lifetime elapsed. Start with a
            new UUID, retaining the account bearer.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: 'invalid_request or invalid_answer: malformed fields or a choice
            not served for this question.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: 'rate_limited: obey Retry-After; reuse request_id/body after
            waiting.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
        '500':
          description: 'server_error: retry safely with the same request_id/body;
            no internal details.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: tour_unavailable, media_unavailable or no_match. Keep the account
            signed in; result remains null unless valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '200':
          description: Complete current tour snapshot. All JSON responses are private/no-store;
            no cookies. New signed sample URLs are issued on each load.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchTourResponse'
      parameters:
      - name: tour
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: slot
        in: path
        required: true
        schema:
          type: string
          enum:
          - level
          - listening
          - reading-1
          - reading-2
          - taste-1
          - taste-2
          - mood
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TourAnswerRequest'
            example:
              request_id: 22222222-2222-4222-8222-222222222222
              revision: 0
              value: beginner
  /match-tours/{tour}/result:
    get:
      operationId: getMatchTourResultV2
      summary: Obtain one stable match after all five steps
      description: After mood, tour status is ready and result remains null. This
        endpoint uses the shared MatchTour keywords and MatchQuiz ranking/fallback/media
        eligibility, pins one match and increments revision once. Repeats do not reroll.
        No eligible result returns 503 no_match, never a false count of one. If a
        pinned piece is withdrawn, return no_match rather than replacing it silently.
        The result reuses PieceSummary; open the existing native piece page using
        result.piece.target.id. This operation grants no full-media entitlement and
        never writes piece-open history. Call the existing pieces/{piece}/view operation
        only after actual native piece opening.
      x-deployment:
        backend_status: implemented_locally
        production_verified: false
      responses:
        '401':
          description: 'unauthenticated: account credential invalid/missing/expired/revoked.
            Only this error requires signing in again.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 'not_found: unknown, another account’s, or pruned tour. Do
            not sign out.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: stale_tour, idempotency_conflict, incomplete_tour or tour_limit.
            Reload; see the error code and match-tour guide.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '410':
          description: 'tour_expired: two-hour tour lifetime elapsed. Start with a
            new UUID, retaining the account bearer.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: 'invalid_request or invalid_answer: malformed fields or a choice
            not served for this question.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: 'rate_limited: obey Retry-After; reuse request_id/body after
            waiting.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
        '500':
          description: 'server_error: retry safely with the same request_id/body;
            no internal details.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: tour_unavailable, media_unavailable or no_match. Keep the account
            signed in; result remains null unless valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '200':
          description: Complete current tour snapshot. All JSON responses are private/no-store;
            no cookies. New signed sample URLs are issued on each load.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MatchTourResponse'
      parameters:
      - name: tour
        in: path
        required: true
        schema:
          type: string
          format: uuid
  /match-tour-media/{asset}/{kind}:
    get:
      operationId: getMatchTourSampleV2
      summary: Fetch a bounded tour sample using its signed capability URL
      security: []
      description: Use the supplied URL verbatim without an Authorization header or
        cookies. Signature covers the path and query. Expires at the earlier of 15
        minutes after issuance or tour expiry. Native HTTP Range requests may read
        only these bounded MP3/PNG files. Missing/tampered/expired signatures return
        403, never 401. Images/artwork/portraits use public HTTPS URLs without a defined
        expiry and may later change or disappear. Reload the bearer-authenticated
        tour to refresh sample URLs. The server never redirects to original recordings,
        PDFs or third-party media. All responses use private/no-store. Overall 120
        requests/minute/IP includes media requests.
      parameters:
      - name: asset
        in: path
        required: true
        schema:
          type: string
          pattern: ^[a-f0-9]{64}$
      - name: kind
        in: path
        required: true
        schema:
          type: string
          enum:
          - audio
          - excerpt
          - sample
      - name: expires
        in: query
        required: true
        schema:
          type: integer
      - name: signature
        in: query
        required: true
        schema:
          type: string
          pattern: ^[a-f0-9]{64}$
      responses:
        '200':
          description: Bounded sample bytes; never original media.
          content:
            audio/mpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '206':
          description: Byte range of the same bounded sample.
        '403':
          description: 'media_url_expired: missing/invalid/expired capability. Reload
            tour; do not sign out.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 'not_found: unknown, another account’s, or pruned tour. Do
            not sign out.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: 'rate_limited: obey Retry-After; reuse request_id/body after
            waiting.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
        '500':
          description: 'server_error: retry safely with the same request_id/body;
            no internal details.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          description: tour_unavailable, media_unavailable or no_match. Keep the account
            signed in; result remains null unless valid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /pieces/{piece}:
    get:
      operationId: getPieceV2
      summary: Load the native piece page from the shared web content sources
      description: Use the existing Keychain v2 bearer. Signed-in accounts receive
        metadata/about/timeline/recommendations and private favorite state. Native
        full media uses the existing local active membership/trial/grace/super-user
        state or the current scheduled Free Pick identity, never a row position or
        browser Access Limits. Unentitled media has blocked mode and null source URLs;
        missing media is unavailable. Copyrighted scores use external purchase links.
        The original files/media hosts remain unchanged; do not forward API bearers
        to them. This GET does not record history or implement favorite/annotation
        writes. POST /pieces/{piece}/view remains a separate confirmed-open operation.
        Random recommendation/release selection uses the existing web algorithms rather
        than a separately curated native catalogue.
      parameters:
      - name: piece
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
      responses:
        '200':
          description: Read-only piece page content. No history, billing or favorite
            mutation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PieceDetailResponse'
        '401':
          description: Missing, invalid, expired or revoked v2 credential.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: Missing/invalid piece identity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: Rate limited; obey Retry-After.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
        '500':
          description: Safe server error; no internal fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
components:
  responses:
    CollectionUnauthenticated:
      description: Missing, expired, revoked or invalid v2 bearer (unauthenticated).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    CollectionRateLimited:
      description: Rate limited (rate_limited). Follow Retry-After.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    CollectionServerError:
      description: Unexpected server error (server_error).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  securitySchemes:
    MobileBearer:
      type: http
      scheme: bearer
      description: 'POST /auth/login with the existing email/password obtains this
        credential. Only Authorization: Bearer <access_token> is accepted. Store in
        Keychain; send only to the fixed v2 origin. Legacy account IDs, cookies and
        downloaded YAML are not credentials.'
