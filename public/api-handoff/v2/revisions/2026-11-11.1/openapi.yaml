          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
    delete:
      operationId: removeFavoriteV2
      summary: Remove the piece from this owned folder only
      description: Bearer only. No body or empty JSON object. Idempotent, returns current heart and folder
