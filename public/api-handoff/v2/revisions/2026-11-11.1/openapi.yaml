          type: object
          required:
          - code
          - message
          - fields
          properties:
            code:
              type: string
            message:
              type: string
            fields:
              type: object
              additionalProperties:
                type: array
                items:
                  type: string
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    Target:
      type: object
      required:
      - kind
      - id
      - query
      - web_url
      properties:
        kind:
          type: string
          enum:
          - piece
          - composer_pieces
          - search
          - composers
          - catalogue
          - highlights
        id:
