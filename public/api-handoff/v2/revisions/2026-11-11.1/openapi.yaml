        PUT succeeds under lowered quotas; DELETE bypasses addition restrictions. Shared owner lock and
        membership uniqueness prevent duplicate records. 30 writes/minute/account plus outer v2 limit; removals
        are still throttled. Locally implemented; deployment pending.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: Authoritative current state.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteFolderMutationResponse'
        '401':
          description: 'unauthenticated: Missing/invalid/expired/revoked bearer; sign in again.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '404':
          description: 'not_found: Missing piece, missing folder or folder not owned. Malformed route paths
            retain generic request_failed.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '422':
          description: 'invalid_request: Invalid JSON/fields, name, ID string, duplicate name or UUID header.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '429':
          description: 'rate_limited: Obey Retry-After before retrying.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
          headers:
