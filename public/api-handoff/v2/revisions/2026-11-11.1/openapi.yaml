          type: string
          format: email
          maxLength: 255
        password:
          type: string
          minLength: 1
          maxLength: 4096
          writeOnly: true
    LoginResponse:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: object
          required:
          - access_token
          - token_type
          - expires_at
          - user
          properties:
            access_token:
              type: string
              pattern: ^[a-f0-9]{64}$
              description: Returned only at issuance. Store in Keychain; never in
                logs/UserDefaults.
            token_type:
              type: string
              enum:
              - Bearer
            expires_at:
              $ref: '#/components/schemas/UtcInstant'
            user:
              $ref: '#/components/schemas/UserSummary'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    CollectionCard:
