openapi: 3.0.3
info:
  title: PianoLIT mobile API v2 — foundation and Discover draft
  version: 0.3.0
  description: >-
    V2 authentication, account session, Discover and recent-history operations
    are implemented and HTTP-tested locally. Deployment/staging/native checks
    are pending; use the manifest's verified base URL before calling a server.
    Existing /api routes are outside this document and remain unchanged.
servers:
  - url: https://api-v2.invalid/api/v2
    description: Non-routable documentation placeholder; use no live server until manifest readiness is updated.
paths:
  /auth/login:
    post:
      operationId: loginV2
      summary: Issue an independent v2 session after password proof
      security: []
      description: No query parameters. Does not log into the browser guard. Existing
        stored user_id is not credential proof. No refresh token is issued. Registration/recovery
        retain their existing flows and must be followed by this password login.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginEnvelope'
        '400': &id001
          $ref: '#/components/responses/BadRequest'
        '401': &id002
          $ref: '#/components/responses/Unauthorized'
        '422': &id003
          $ref: '#/components/responses/ValidationError'
        '429': &id004
          $ref: '#/components/responses/RateLimited'
        '500': &id005
          $ref: '#/components/responses/ServerError'
        '503': &id006
          $ref: '#/components/responses/Unavailable'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /auth/me:
    get:
      operationId: getV2Account
      summary: Resolve the account from the bearer session
      description: No body or query parameters. Cookies and legacy account IDs do
        not authenticate this operation.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountEnvelope'
        '400': *id001
        '401': *id002
        '422': *id003
        '429': *id004
        '500': *id005
        '503': *id006
  /auth/logout:
    post:
      operationId: logoutV2
      summary: Revoke the presented v2 session only
      description: Other login sessions stay active. No body or an empty JSON object
        is accepted. A repeated request with the revoked token returns 401.
      requestBody: &id007
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties: {}
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutEnvelope'
        '400': *id001
        '401': *id002
        '422': *id003
        '429': *id004
        '500': *id005
        '503': *id006
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
  /discover:
    get:
      operationId: getDiscover
      summary: Read the exact shared web Discover content as data
      description: No body, query parameters or user_id. Returns DiscoverFeed for
        the verified bearer principal. Does not record a piece open. Native rendering
        must preserve section and item order, with no independent selection or reshuffling.
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoverEnvelope'
        '400': *id001
        '401': *id002
        '422': *id003
        '429': *id004
        '500': *id005
        '503': *id006
  /pieces/{piece_id}/view:
    post:
      operationId: recordPieceView
      summary: Accept a confirmed native piece open for account-owned recent history
      description: Call only after native detail opens successfully. No feed/image
        prefetch or failed-open writes. Authentication, ownership and exclusions are
        server-owned. Retries preserve one account/piece row but update recency. No
        body or an empty JSON object; no submitted user_id.
      parameters:
      - name: piece_id
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/Identifier'
      requestBody: *id007
      responses:
        '200':
          description: Successful response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PieceViewEnvelope'
        '400': *id001
        '401': *id002
        '422': *id003
        '429': *id004
        '500': *id005
        '503': *id006
        '404':
          $ref: '#/components/responses/NotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
security:
  - MobileBearer: []
x-handoff:
  revision: "2026-10-26.2"
  status: draft
  implemented: true
  deployment_status: not_deployed
  implemented_operations: [loginV2, getV2Account, logoutV2, getDiscover, recordPieceView]
  connection_instructions: CONNECT_DISCOVER.md
  specification_reference: https://spec.openapis.org/oas/v3.0.3.html
  response_fixtures:
    fixtures/login.json:
      schema: '#/components/schemas/LoginEnvelope'
    fixtures/account.json:
      schema: '#/components/schemas/AccountEnvelope'
    fixtures/logout.json:
      schema: '#/components/schemas/LogoutEnvelope'
    fixtures/discover.json:
      schema: '#/components/schemas/DiscoverEnvelope'
    fixtures/discover-with-history.json:
      schema: '#/components/schemas/DiscoverEnvelope'
    fixtures/discover-empty.json:
      schema: '#/components/schemas/DiscoverEnvelope'
    fixtures/unauthenticated.json:
      schema: '#/components/schemas/ErrorEnvelope'
    fixtures/invalid-credentials.json:
      schema: '#/components/schemas/ErrorEnvelope'
    fixtures/invalid-request.json:
      schema: '#/components/schemas/ErrorEnvelope'
components:
  securitySchemes:
    MobileBearer:
      type: http
      scheme: bearer
      description: >-
        Independent opaque per-login credential, returned only by password login.
        Default absolute lifetime is 30 days; no refresh/renewal endpoint. Logout
        revokes only the presented session. Password/email changes, deletion or
        server revocation invalidate it. Only Authorization bearer is accepted;
        no browser cookies or legacy user_id. Missing/invalid/expired/revoked
        credentials return 401 on protected operations.
  schemas:
    LoginRequest:
      type: object
      additionalProperties: false
      required:
      - email
      - password
      properties:
        email:
          type: string
          format: email
          maxLength: 254
          description: Trimmed and matched case-insensitively; ambiguous duplicate accounts
            are rejected.
        password:
          type: string
          minLength: 1
          maxLength: 1024
          format: password
          writeOnly: true
          description: Password bytes are not trimmed; never retain or log this value.
    AccountSummary:
      type: object
      required:
      - id
      - first_name
      - last_name
      - email
      properties:
        id:
          $ref: '#/components/schemas/Identifier'
        first_name:
          type: string
        last_name:
          type: string
        email:
          type: string
          format: email
    LoginEnvelope:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: object
          required:
          - token_type
          - access_token
          - expires_at
          - account
          properties:
            token_type:
              type: string
              enum:
              - Bearer
            access_token:
              type: string
              minLength: 1
              description: Opaque secret returned once; store only in Keychain. Example
                fixture tokens are not credentials.
            expires_at:
              $ref: '#/components/schemas/UtcInstant'
            account:
              $ref: '#/components/schemas/AccountSummary'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    AccountEnvelope:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: object
          required:
          - account
          properties:
            account:
              $ref: '#/components/schemas/AccountSummary'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    LogoutEnvelope:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: object
          required:
          - logged_out
          properties:
            logged_out:
              type: boolean
              enum:
              - true
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    PieceViewEnvelope:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          type: object
          required:
          - accepted
          properties:
            accepted:
              type: boolean
              enum:
              - true
              description: Accepted according to account history/exclusion rules; does
                not reveal an exclusion flag.
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    DiscoverEnvelope:
      type: object
      required:
      - data
      - meta
      properties:
        data:
          $ref: '#/components/schemas/DiscoverData'
        meta:
          $ref: '#/components/schemas/ResponseMeta'
    Identifier:
      type: string
      pattern: '^[1-9][0-9]*$'
      example: "123"
      description: Opaque decimal string preserving the existing database identity.
    DiscoverData:
      type: object
      required: [sections]
      description: >-
        GET /discover output under data, rendered through DiscoverResource.
        Content comes only from DiscoverFeed, shared with web. Array order is
        display order; Swift must not independently select, shuffle or trim it.
      properties:
        sections:
          type: array
          items:
            oneOf:
              - {$ref: '#/components/schemas/DiscoverPieceSection'}
              - {$ref: '#/components/schemas/DiscoverComposerSection'}
              - {$ref: '#/components/schemas/DiscoverComposerFeature'}
              - {$ref: '#/components/schemas/DiscoverLevelsSection'}
    DiscoverComposerSummary:
      type: object
      required: [id, name, short_name, portrait_url, piece_count, destination]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        name: {type: string}
        short_name: {type: string}
        portrait_url: {type: string, format: uri}
        piece_count: {type: integer, minimum: 0}
        destination:
          type: object
          required: [kind, id]
          properties:
            kind: {type: string, enum: [composer_repertoire]}
            id: {$ref: '#/components/schemas/Identifier'}
    DiscoverPieceSummary:
      type: object
      required: [id, title, composer, attribution, artwork_url, difficulty, is_new, is_free_pick, available_media, destination]
      properties:
        id: {$ref: '#/components/schemas/Identifier'}
        title: {type: string}
        composer: {$ref: '#/components/schemas/DiscoverComposerSummary'}
        attribution: {type: string, nullable: true}
        artwork_url: {type: string, format: uri}
        difficulty:
          type: object
          required: [name, label]
          properties:
            name: {type: string, nullable: true}
            label: {type: string, nullable: true}
        is_new: {type: boolean}
        is_free_pick:
          type: boolean
          description: Current identity only; neither this flag nor section position grants media access.
        available_media:
          type: object
          required: [video, audio, score, synthesia]
          description: Media availability only; native entitlements remain a separate contract.
          properties:
            video: {type: boolean}
            audio: {type: boolean}
            score: {type: boolean}
            synthesia: {type: boolean}
        destination:
          type: object
          required: [kind, id]
          properties:
            kind: {type: string, enum: [piece]}
            id: {$ref: '#/components/schemas/Identifier'}
    DiscoverPieceSection:
      type: object
      required: [id, title, kind, items]
      properties:
        id:
          type: string
          enum: [free_pick, recently_viewed, latest_pieces, for_you, past_highlights, mood, similar_to_free_pick]
        title: {type: string}
        subtitle: {type: string}
        kind: {type: string, enum: [featured_piece, compact_piece_rail, artwork_piece_rail, featured_piece_list]}
        query: {type: string}
        items:
          type: array
          maxItems: 12
          description: Shared feed limits apply; For you at most six, past highlights seven, current Free Pick one.
          items: {$ref: '#/components/schemas/DiscoverPieceSummary'}
    DiscoverComposerSection:
      type: object
      required: [id, title, kind, items]
      properties:
        id: {type: string, enum: [composers]}
        title: {type: string}
        kind: {type: string, enum: [composer_rail]}
        items:
          type: array
          maxItems: 12
          items: {$ref: '#/components/schemas/DiscoverComposerSummary'}
    DiscoverComposerFeature:
      type: object
      required: [id, title, kind, group, composer, biography_excerpt, items]
      properties:
        id: {type: string, enum: [composer_feature]}
        title: {type: string}
        kind: {type: string, enum: [composer_feature]}
        group: {type: string, enum: [women, black]}
        composer: {$ref: '#/components/schemas/DiscoverComposerSummary'}
        biography_excerpt: {type: string}
        query: {type: string}
        items:
          type: array
          minItems: 1
          maxItems: 12
          items: {$ref: '#/components/schemas/DiscoverPieceSummary'}
    DiscoverLevelsSection:
      type: object
      required: [id, title, subtitle, kind, systems]
      properties:
        id: {type: string, enum: [levels]}
        title: {type: string}
        subtitle: {type: string}
        kind: {type: string, enum: [level_systems]}
        systems:
          type: array
          minItems: 3
          maxItems: 3
          description: RCM, ABRSM, Suzuki order; activate the first system with items, disabling empty systems.
          items:
            type: object
            required: [id, label, items]
            properties:
              id: {type: string, enum: [rcm, abrsm, suzuki]}
              label: {type: string}
              items:
                type: array
                description: Natural numeric order supplied by the shared feed helper.
                items:
                  type: object
                  required: [number, label, piece_count, destination]
                  properties:
                    number: {type: string}
                    label: {type: string}
                    piece_count: {type: integer, minimum: 0}
                    destination:
                      type: object
                      required: [kind, query]
                      properties:
                        kind: {type: string, enum: [search]}
                        query: {type: string}
    UtcInstant:
      type: string
      format: date-time
      pattern: 'Z$'
      example: "2026-10-22T12:00:00Z"
    PageInfo:
      type: object
      required: [next_cursor, has_more]
      properties:
        next_cursor:
          type: string
          nullable: true
          description: Opaque cursor; null exactly when has_more is false.
        has_more:
          type: boolean
    ResponseMeta:
      type: object
      required: [request_id]
      properties:
        request_id:
          type: string
          format: uuid
          description: Non-secret server-generated correlation identifier; incoming IDs are not trusted.
        page:
          $ref: '#/components/schemas/PageInfo'
    ErrorEnvelope:
      type: object
      required: [error, meta]
      properties:
        error:
          type: object
          required: [code, message, fields]
          properties:
            code:
              type: string
              example: invalid_request
            message:
              type: string
              example: Please check the highlighted fields.
            fields:
              type: object
              description: Empty object for non-validation errors; values are arrays of safe display messages.
              additionalProperties:
                type: array
                items: {type: string}
        meta:
          $ref: '#/components/schemas/ResponseMeta'
  parameters:
    Limit:
      name: limit
      in: query
      schema: {type: integer, minimum: 1, maximum: 50, default: 20}
    Cursor:
      name: cursor
      in: query
      schema: {type: string, minLength: 1}
  responses:
    Unauthorized:
      description: Missing, malformed, expired or revoked credential, or invalid password proof on login.
      headers:
        WWW-Authenticate:
          schema: {type: string, enum: [Bearer]}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    ValidationError:
      description: Invalid request.
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    RateLimited:
      description: Retry after the specified number of seconds.
      headers:
        Retry-After:
          schema: {type: integer, minimum: 1}
      content:
        application/json:
          schema: {$ref: '#/components/schemas/ErrorEnvelope'}
    BadRequest:
      description: Malformed JSON or HTTPS required.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    UnsupportedMediaType:
      description: Non-JSON request body.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: Unknown operation or missing piece.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ServerError:
      description: Unexpected failure, with a safe redacted message.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unavailable:
      description: Temporarily unavailable, including a shared feed lock timeout.
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
