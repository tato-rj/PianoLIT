backend_static_cross_checks:
  login:
    finding: Current controller checks email/password and returns the User; it issues no independent API credential.
    evidence: app/Http/Controllers/Auth/Api/LoginController.php
  request_identity:
    finding: Legacy API middleware logs in a submitted user_id. The api middleware group has no StartSession; v2 must use an independent verified identity boundary.
    evidence: [app/Http/Middleware/AttemptLoginAppUser.php, app/Http/Kernel.php]
  registration:
    finding: Registration logs into the web guard and returns a flat User for ios origin; do not assume this supplies a reusable native v2 credential.
    evidence: app/Http/Controllers/Auth/RegisterController.php
  piece_destination:
    finding: Current feed factory supplies api.pieces.find; GET/POST /api/pieces/find reads search and returns a one-element legacy piece array with request-derived favorite state.
    evidence: [app/Api/Factory.php, routes/api/pieces.php, app/Http/Controllers/Api/PiecesController.php]
  status:
    finding: Status resolves submitted user_id and calls getStatus with callApple enabled; do not use live calls as harmless verification.
    evidence: app/Http/Controllers/MembershipsController.php
  history:
    finding: Inspected mobile piece detail logs activity but does not call RecentlyViewedPieces. The separate pieces/views route records piece_views, not account-owned recently_viewed_pieces. Current web piece opening records the latter.
    evidence: [app/Http/Controllers/Api/PiecesController.php, app/Http/Controllers/WebApp/PiecesController.php, app/Http/Middleware/Logs/RecordAppLog.php]

remaining_evidence:
  - Attach the native commit and current release/build identifier to make this baseline reproducible.
  - Verify actual device rotation, Dynamic Type and view reuse with simulator/device captures.
  - Capture synthetic request/response fixtures on staging; never collect real passwords/tokens/account data for this bundle.
