architecture:
  ui: UIKit with storyboards and nibs; no SwiftUI implementation reported.
  pattern: View-controller-owned screen state with callback-based request/parser classes and delegates.
  entry: AppDelegate and SceneDelegate; Onboard scene, then Main five-tab controller.
  navigation: Storyboard segues, modals and navigation stacks for Discover, Explore, playlists, user and Settings.
  networking: Alamofire 4.9.1 and SwiftyJSON 4.3.0 through CocoaPods; URLSession also used for images/PDFs.
  workspace: PianoLIT.xcworkspace
  persistence: UserDefaults account/login/subscription fields; in-memory Discover arrays and URL-keyed NSCache images.
  core_data: Empty model reported; no persistence stack found.
