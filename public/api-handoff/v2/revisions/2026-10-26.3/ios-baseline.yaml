discover:
  model: Aligned arrays in GetDiscover; no typed section/card model or schema-aware error handling.
  layout: Table rows containing horizontal collections; row 0 selects Free Pick, row 1 selects composers.
  cards: DiscoverCell, FreePickCell.xib, ComposerCell.xib and DiscoverItemCell storyboard prototype.
  fonts: Poppins headings, Open Sans body/cards; both already bundled.
  styles: Shared Helper uses 20-point radius, named gradients, difficulty colors and blue variants.
  loading: Activity indicator, temporary generic error alert and ReachabilityView; connectivity recovery reloads.
  missing_states: No dedicated empty-feed presentation or pull-to-refresh reported.
  signed_in_only: Normal onboarding requires login; initial Discover load requires stored account ID.
  caching: Feed arrays in memory only; no explicit persistent feed cache, TTL or pagination reported.
  calls:
    - purpose: feed
      request: GET /api/discover
      fields: [api, user_id]
      response: Top-level sections with title/content; card fields include name, subtitle, source, color, background, type, id, extended_level_name, is_new.
    - purpose: membership_status
      request: POST /api/memberships/status
      fields: [user_id]
      response: JSON status string used by local access checks.
    - purpose: piece_card
      request: POST to card.source
      fields: [search, user_id, api]
      response: Full legacy piece array; the first item is passed through LoadVC to PieceVC.
    - purpose: non_piece_card
      request: GET to card.source
      fields: [search, user_id, api, global]
      response: Legacy piece collection presented by MatchVC; composer cards open repertoire results.
    - purpose: all_composers
      request: GET /api/composers, then GET /api/search after selection
      response: Composer reversed_name and pieces_count, followed by legacy piece results.
    - purpose: find_your_match
      request: GET /api/tour
      fields: [search, user_id, api]
      response: Legacy piece results; search contains calculated tour tags.
  access_coupling:
    - LoadVC normally admits active/trial status; missing status defaults to false.
    - Every piece in Discover row 0 bypasses that gate through positional isFreePick.
    - Membership refresh and feed load run concurrently, so cached/default status can affect initial access.
  detail_dependencies:
    - GetFromDb/DataCell expects rich metadata, favorites, composer/country, tags, rankings, collection, timeline and media.
    - PieceVC leads to score/PDFKit, AVPlayer, similar/collection results, composer detail and review checks.
    - No explicit native recently-viewed write was found in Discover → LoadVC → PieceVC.
