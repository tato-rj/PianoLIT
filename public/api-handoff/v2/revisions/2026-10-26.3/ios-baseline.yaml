account_flows:
  base_url: https://pianolit.com
  wired_sign_in_methods: [email_password]
  provider_sign_in: No wired Apple, Google or Facebook sign-in/account linking found; metadata alone is not implementation.
  login:
    method: POST
    path: /api/users/login
    json_fields: [email, password]
    expected_response: Flat user object; nonempty id is interpreted as local success.
  registration:
    method: POST
    path: /register
    json_fields: [first_name, last_name, email, password, password_confirmation, origin]
    origin: ios
    expected_response: Flat user object; success enters Main and persists identity.
  password_recovery:
    method: GET
    path: /password/reset
    presentation: WKWebView; no native reset API/completion callback reported.
  identity:
    persisted_keys: [userID, firstName, isLoggedIn]
    other_cached_state: Subscription status is also persisted; its exact key name was not included in the report.
    id_conversion: Helper.getUserID requires a positive integer and converts it to a string.
    requests: Subsequent requests submit user_id; no explicit bearer credential or signed request flow found.
    credentials: No app-owned token/password persistence or Keychain implementation found.
    startup: Trusts stored account ID and local login Boolean; no server reauthentication reported.
    cookies: Default URLSession may retain cookies; actual production cookie participation/lifetime is unverified.
    logout: Clears local identity/subscription state and presents onboarding; no server revocation or explicit cookie/image-cache clearing reported.
    expiry_and_renewal: No token expiration, refresh or revocation implementation found.
