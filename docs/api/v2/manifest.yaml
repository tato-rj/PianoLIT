schema_version: 1
revision: 2026-10-26.3
updated_on: '2026-10-26'
title: PianoLIT iOS v2 handoff
status: draft
purpose: Development instructions for the backend and iOS teams; not app runtime configuration.
api_major_version: 2
runtime:
  implemented: true
  staging_base_url: null
  production_base_url: null
  existing_api: unchanged
  deployment_status: not_deployed
entrypoints:
  instructions: README.md
  foundations: foundations.yaml
  native_baseline: ios-baseline.yaml
  contract: openapi.yaml
  design: design.yaml
  references: references.yaml
  connection: CONNECT_DISCOVER.md
files:
- path: README.md
- path: foundations.yaml
- path: ios-baseline.yaml
- path: openapi.yaml
- path: design.yaml
- path: references.yaml
- path: screens/discover.yaml
- path: CONNECT_DISCOVER.md
- path: fixtures/account.json
- path: fixtures/discover-empty.json
- path: fixtures/discover-with-history.json
- path: fixtures/discover.json
- path: fixtures/invalid-credentials.json
- path: fixtures/invalid-request.json
- path: fixtures/login.json
- path: fixtures/logout.json
- path: fixtures/unauthenticated.json
features:
- id: foundations
  document: foundations.yaml
  status: draft
  backend_status: implemented_local
  ios_status: not_verified
  depends_on: []
- id: discover
  document: screens/discover.yaml
  status: draft
  backend_status: implemented_local
  ios_status: not_verified
  depends_on:
  - foundations
consumer_rules:
- Read README.md and foundations.yaml before any screen specification.
- Pin one revision per implementation task; do not mix files from different revisions.
- Draft permits local implementation and fixture-based decoding/UI work; it does not
  identify a verified remote API.
- Implement against staging only when the feature is ready_for_ios and staging_base_url
  is populated.
- Production use requires feature status released and an explicit production_base_url.
- Open each available reference image; a YAML path alone is not a visual reference.
- Develop only the updated Swift app. Preserve legacy backend API compatibility for
  old installed builds; no old Swift branch or shipping mode maintenance is required.
- Record revision, feature IDs, iOS commit, build and verification in the iOS repository.
- Report ambiguities or missing dependencies instead of inventing endpoint or access
  behavior.
- Fetch CONNECT_DISCOVER.md and fixtures from this same manifest revision; the sync
  script downloads instructions/contracts and does not rewrite Swift networking.
changelog:
- revision: 2026-10-26.3
  changes:
  - Arthur clarified that all Swift work targets the updated app; the old Swift app/source
    is no longer maintained.
  - Legacy support remains a backend API/authentication/media compatibility obligation
    for users who never update, without requiring v2 tokens or forced app updates.
  - Clarified that any temporary legacy-endpoint adapter belongs to the updated app,
    not a separate maintained old Swift branch or shipping mode.
  - Documentation clarification only; runtime, schemas, fixtures and deployment readiness
    are unchanged.
- revision: 2026-10-26.2
  changes:
  - Implemented isolated password login, bearer guard, account-session read, per-session
    logout, Discover and authenticated piece-open history routes.
  - Tokens are hashed, expire after 30 days by default and become invalid after password/email
    changes or account deletion; no refresh tokens or changes to legacy API identity.
  - Added safe v2 JSON errors/meta, independent rate limits, session pruning, HTTP
    regression checks and synthetic response fixtures.
  - Included CONNECT_DISCOVER.md in this same YAML-manifest bundle for the existing
    Swift sync script.
  - Backend is implemented locally; deployment, verified staging URL and native integration
    remain pending, so readiness stays draft.
- revision: 2026-10-26.1
  changes:
  - Arthur requires identical Discover content on web and iOS v2, with platform-specific
    presentation only.
  - Implemented one shared content service and a local v2 JSON resource, including
    six For you pieces and the cached women/Black composer choice.
  - Added parity tests for content order, account identity, refresh, favorite changes,
    Free Pick rotation and serialization isolation.
  - Updated the draft content contract; authentication, v2 routes, staging and native
    integration remain unimplemented.
- revision: 2026-10-22.2
  changes:
  - Recorded the developer's static UIKit/iOS 17.6/email-password baseline with its
    verification limits.
  - Arthur confirmed sign-in remains required for the initial native v2 release.
  - Identified positional Free Pick handling and legacy detail/search dependencies
    in Discover.
  - No runtime implementation or deployment; retained the previous immutable handoff
    revision.
- revision: 2026-10-22.1
  changes:
  - Established the handoff format, shared API proposals and compatibility boundaries.
  - Inventoried Discover against the current web implementation.
  - No runtime endpoints, migrations, Swift changes or deployment in this revision.
